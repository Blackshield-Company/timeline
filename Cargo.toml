[package]
name = "timeline"
version = "0.1.0"
edition = "2021"
description = "Local-first evidence timeline builder for detectives and defense attorneys"
license = "Apache-2.0"

[[bin]]
name = "timeline"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
anyhow = "1"
